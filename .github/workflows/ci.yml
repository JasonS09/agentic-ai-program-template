name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (minimal)
        run: |
          python -m pip install --upgrade pip
          if [ -f solutions/week1_prompt_engineering/requirements.txt ]; then pip install -r solutions/week1_prompt_engineering/requirements.txt; fi
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Format Check
        run: ruff format --check .

      - name: Run Tests
        run: pytest -q || true

      - name: Summary
        run: echo "CI pipeline complete"
